<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BREACHPOINT Prototype</title>
<style>
html,body{margin:0;background:#0b0f14;height:100%;overflow:hidden;font-family:system-ui,sans-serif}
canvas{display:block;margin:auto;width:min(100vw,calc(100vh*1.7143));height:auto;cursor:crosshair;user-select:none}
</style></head><body><canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=1200,H=700;cv.width=W;cv.height=H;
const WIN=13;
const WALLS=[[300,0,30,260],[300,380,30,320],[600,200,30,300],[600,0,30,120],[820,120,30,250],[900,430,200,30],[430,520,150,30],[150,190,140,30],[480,300,100,30]];
const SITES={A:{x:1000,y:150,r:70,c:'255,190,60'},B:{x:200,y:560,r:70,c:'80,200,255'}};
const WEAPONS={
 pistol:{name:'Pistol',cost:0,dmg:25,rate:.3,spread:.05,pellets:1,mag:12,range:700},
 smg:{name:'SMG',cost:1200,dmg:18,rate:.08,spread:.09,pellets:1,mag:30,range:500},
 rifle:{name:'Rifle',cost:2700,dmg:30,rate:.11,spread:.03,pellets:1,mag:30,range:900},
 shotgun:{name:'Shotgun',cost:1100,dmg:14,rate:.8,spread:.22,pellets:6,mag:6,range:350}
};
const WKEYS={'1':'pistol','2':'smg','3':'rifle','4':'shotgun'};
const keys={};const mouse={x:W/2,y:H/2,down:false};
let state='buy',round=1,scores={me:0,en:0},msg='',msgT=0,roundT=100;
let bomb=null,bombT=0,plantProg=0,defProg=0,smokes=[],flashes=[],tracers=[];
let player,bots=[],ents=[];

addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;onKey(k);if(k===' ')e.preventDefault()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function toWorld(e){const r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height}
cv.addEventListener('mousemove',toWorld);
cv.addEventListener('mousedown',e=>{toWorld(e);mouse.down=true});
addEventListener('mouseup',()=>mouse.down=false);

function say(t,s=2){msg=t;msgT=s}
function mkE(team,isP){return{team,isP,x:0,y:0,hp:100,alive:true,weapon:'pistol',ammo:12,cd:0,rl:0,credits:800,owned:['pistol'],sm:0,fl:0,site:'A',stun:0,aimA:0,pT:0,off:{x:0,y:0}}}

function newMatch(){
  scores={me:0,en:0};round=1;
  player=mkE('ATK',true);
  bots=[];for(let i=0;i<9;i++)bots.push(mkE('ATK',false));
  ents=[player,...bots];
  beginBuy();
}

function applyTeams(){
  const opp=player.team==='ATK'?'DEF':'ATK';
  bots.forEach((b,i)=>{
    b.team=i<4?player.team:opp;
    b.site=i%2?'A':'B';
    b.off={x:(Math.random()-.5)*70,y:(Math.random()-.5)*70};
  });
  ents.forEach(e=>{
    const atk=e.team==='ATK';
    e.x=atk?90+Math.random()*60:1050+Math.random()*60;
    e.y=250+Math.random()*200;
    e.alive=true;e.hp=100;
  });
}

function botBuy(e){
  if(e.credits>=2700){e.weapon='rifle';e.credits-=2700}
  else if(e.credits>=1200){e.weapon='smg';e.credits-=1200}
  else e.weapon='pistol';
  e.ammo=WEAPONS[e.weapon].mag;
}

function beginBuy(){
  state='buy';
  applyTeams();
  ents.forEach(e=>{
    e.stun=0;e.cd=0;e.rl=0;e.pT=0;e.sm=0;e.fl=0;e.owned=['pistol'];e.weapon='pistol';e.ammo=12;
    if(!e.isP)botBuy(e);
  });
  bomb=null;bombT=0;plantProg=0;defProg=0;smokes=[];flashes=[];tracers=[];roundT=100;
}

function startRound(){
  if(state!=='buy')return;
  state='live';roundT=100;
}

function buyWeapon(id){
  if(!player.owned.includes(id)){
    if(player.credits<WEAPONS[id].cost){say('Not enough credits');return}
    player.credits-=WEAPONS[id].cost;player.owned.push(id);
  }
  player.weapon=id;player.ammo=WEAPONS[id].mag;player.rl=0;
}
function buyAbility(a){
  if(player.credits<200){say('Not enough credits');return}
  if(player[a]>=2){say('Max 2 of each');return}
  player.credits-=200;player[a]++;
}

function onKey(k){
  if(state==='buy'){
    if(WKEYS[k])buyWeapon(WKEYS[k]);
    if(k==='5')buyAbility('sm');
    if(k==='6')buyAbility('fl');
    if(k==='x'){player.team=player.team==='ATK'?'DEF':'ATK';applyTeams();}
    if(k==='enter')startRound();
  }else if(state==='live'){
    if(WKEYS[k]&&player.owned.includes(WKEYS[k])){player.weapon=WKEYS[k];player.ammo=WEAPONS[k].mag;player.rl=0}
    if(k==='q')useAbility('sm');
    if(k==='e')useAbility('fl');
  }else if(state==='over'&&k==='enter')newMatch();
}

function target(){
  const dx=mouse.x-player.x,dy=mouse.y-player.y,d=Math.hypot(dx,dy)||1;
  const m=Math.min(d,300);
  return{x:player.x+dx/d*m,y:player.y+dy/d*m};
}
function useAbility(a){
  if(!player.alive)return;
  const t=target();
  if(a==='sm'&&player.sm>0){player.sm--;smokes.push({x:t.x,y:t.y,r:70,t:12})}
  if(a==='fl'&&player.fl>0){
    player.fl--;flashes.push({x:t.x,y:t.y,t:.4});
    bots.forEach(b=>{if(b.team!==player.team&&b.alive&&Math.hypot(b.x-t.x,b.y-t.y)<220)b.stun=2.5});
  }
}

function inWall(x,y){return WALLS.some(([wx,wy,ww,wh])=>x>wx&&x<wx+ww&&y>wy&&y<wy+wh)}
function inSmoke(x,y){return smokes.some(s=>Math.hypot(x-s.x,y-s.y)<s.r)}
function blocked(x0,y0,x1,y1){
  const d=Math.hypot(x1-x0,y1-y0),n=Math.ceil(d/10);
  for(let i=1;i<n;i++){const x=x0+(x1-x0)*i/n,y=y0+(y1-y0)*i/n;if(inWall(x,y)||inSmoke(x,y))return true}
  return false;
}
function hitsWall(x,y,r){
  if(x<r||x>W-r||y<r||y>H-r)return true;
  return WALLS.some(([wx,wy,ww,wh])=>{const cx=Math.max(wx,Math.min(x,wx+ww)),cy=Math.max(wy,Math.min(y,wy+wh));return Math.hypot(x-cx,y-cy)<r});
}
function moveE(e,ux,uy,d){
  const nx=e.x+ux*d,ny=e.y+uy*d;
  if(!hitsWall(nx,e.y,12))e.x=nx;
  if(!hitsWall(e.x,ny,12))e.y=ny;
}
function siteAt(x,y){for(const k of['A','B'])if(Math.hypot(x-SITES[k].x,y-SITES[k].y)<SITES[k].r)return k;return null}

function kill(e){
  e.alive=false;e.hp=0;
  if(e.isP)say('Eliminated',2);
}

function fire(e,tx,ty){
  const w=WEAPONS[e.weapon];
  if(!e.alive||e.cd>0||e.rl>0)return;
  if(e.ammo<=0){e.rl=1.6;return}
  e.ammo--;e.cd=w.rate;
  if(e.ammo<=0)e.rl=1.6;
  const base=Math.atan2(ty-e.y,tx-e.x);e.aimA=base;
  for(let p=0;p<w.pellets;p++){
    const a=base+(Math.random()-.5)*2*w.spread;
    const dx=Math.cos(a),dy=Math.sin(a);
    let end=null,hitE=null;
    for(let d=18;d<w.range;d+=5){
      const x=e.x+dx*d,y=e.y+dy*d;
      if(inWall(x,y)||inSmoke(x,y)){end=d;break}
      const t=ents.find(f=>f.alive&&f.team!==e.team&&Math.hypot(f.x-x,f.y-y)<13);
      if(t){hitE=t;end=d;break}
    }
    if(end===null)end=w.range;
    tracers.push({x1:e.x,y1:e.y,x2:e.x+dx*end,y2:e.y+dy*end,t:.06});
    if(hitE){hitE.hp-=w.dmg;if(hitE.hp<=0)kill(hitE)}
  }
}

function nearestFoe(b){
  let best=null,bd=650;
  for(const f of ents){
    if(!f.alive||f.team===b.team)continue;
    const d=Math.hypot(f.x-b.x,f.y-b.y);
    if(d<bd&&!blocked(b.x,b.y,f.x,f.y)){bd=d;best=f}
  }
  return best;
}

function endRound(w,reason){
  state='end';
  const won=w===player.team;
  won?scores.me++:scores.en++;
  ents.forEach(e=>e.credits+=e.team===w?3000:1900);
  say(`${won?'Round won':'Round lost'}: ${reason}`,3.5);
  round++;
  if(scores.me>=WIN||scores.en>=WIN)state='over';
}

function update(dt){
  smokes.forEach(s=>s.t-=dt);smokes=smokes.filter(s=>s.t>0);
  flashes.forEach(s=>s.t-=dt);flashes=flashes.filter(s=>s.t>0);
  tracers.forEach(s=>s.t-=dt);tracers=tracers.filter(s=>s.t>0);
  ents.forEach(e=>{
    e.cd-=dt;
    if(e.rl>0){e.rl-=dt;if(e.rl<=0)e.ammo=WEAPONS[e.weapon].mag}
  });
  if(msgT>0)msgT-=dt;
  if(state==='end'){if(msgT<=0)beginBuy();return}
  if(state!=='live')return;

  roundT-=dt;
  if(bomb)bombT-=dt;

  // player movement, aim, fire
  if(player.alive){
    const dx=((keys['d']||keys['arrowright'])?1:0)-((keys['a']||keys['arrowleft'])?1:0);
    const dy=((keys['s']||keys['arrowdown'])?1:0)-((keys['w']||keys['arrowup'])?1:0);
    if(dx||dy){const l=Math.hypot(dx,dy);moveE(player,dx/l,dy/l,190*dt)}
    player.aimA=Math.atan2(mouse.y-player.y,mouse.x-player.x);
    if(mouse.down)fire(player,mouse.x,mouse.y);
  }

  // planting (attackers) with F hold, bots plant after 3s on their site
  if(!bomb){
    if(player.alive&&player.team==='ATK'&&keys['f']){
      const s=siteAt(player.x,player.y);
      if(s){plantProg+=dt;if(plantProg>=3)plant(s,player.x,player.y)}else plantProg=0;
    }else plantProg=0;
    bots.forEach(b=>{
      if(!bomb&&b.alive&&b.team==='ATK'&&!b.isP&&b.stun<=0&&siteAt(b.x,b.y)===b.site){
        b.pT+=dt;if(b.pT>=3)plant(b.site,b.x,b.y);
      }
    });
  }

  // defusing (defenders), hold F or bots nearby
  if(bomb){
    const near=ents.some(e=>e.alive&&e.team==='DEF'&&(e.isP?keys['f']:true)&&Math.hypot(e.x-bomb.x,e.y-bomb.y)<60);
    defProg=near?defProg+dt:Math.max(0,defProg-dt);
    if(defProg>=4){endRound('DEF','AETHER Core defused');return}
  }

  // bot AI
  bots.forEach(b=>{
    if(!b.alive)return;
    if(b.stun>0){b.stun-=dt;return}
    const foe=nearestFoe(b);
    const onBomb=bomb&&b.team==='DEF';
    let gx,gy;
    if(bomb){gx=bomb.x+b.off.x*.5;gy=bomb.y+b.off.y*.5}
    else{gx=SITES[b.site].x+b.off.x;gy=SITES[b.site].y+b.off.y}
    const dg=Math.hypot(gx-b.x,gy-b.y);
    if(dg>25)moveE(b,(gx-b.x)/dg,(gy-b.y)/dg,165*dt);
    if(foe){
      const w=WEAPONS[b.weapon];
      if(Math.hypot(foe.x-b.x,foe.y-b.y)<w.range&&b.cd<=0){
        fire(b,foe.x+(Math.random()-.5)*20,foe.y+(Math.random()-.5)*20);
      }
    }
  });

  // round end checks
  const atk=ents.filter(e=>e.alive&&e.team==='ATK').length;
  const def=ents.filter(e=>e.alive&&e.team==='DEF').length;
  if(bomb){
    if(bombT<=0){endRound('ATK','AETHER Core detonated');return}
    if(def===0){endRound('ATK','defenders eliminated');return}
  }else{
    if(atk===0){endRound('DEF','attackers eliminated');return}
    if(def===0){endRound('ATK','defenders eliminated');return}
    if(roundT<=0){endRound('DEF','time expired');return}
  }
}

function plant(site,x,y){
  bomb={x:SITES[site].x,y:SITES[site].y,site};
  bombT=40;plantProg=0;
  say('AETHER Core planted at '+site,2);
}

function drawEnt(e){
  if(!e.alive){ctx.fillStyle='rgba(110,110,110,.45)';ctx.beginPath();ctx.arc(e.x,e.y,11,0,6.283);ctx.fill();return}
  ctx.beginPath();ctx.arc(e.x,e.y,12,0,6.283);
  ctx.fillStyle=e.team==='ATK'?'#ffb03b':'#4fc3ff';ctx.fill();
  ctx.lineWidth=e.isP?3:1.5;ctx.strokeStyle=e.isP?'#fff':'#0b0f14';ctx.stroke();
  ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(e.x,e.y);
  ctx.lineTo(e.x+Math.cos(e.aimA)*18,e.y+Math.sin(e.aimA)*18);ctx.stroke();
  if(e.stun>0){ctx.strokeStyle='#ffe85a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(e.x,e.y,17,0,6.283);ctx.stroke()}
  ctx.fillStyle='#333';ctx.fillRect(e.x-14,e.y-22,28,4);
  ctx.fillStyle='#5f5';ctx.fillRect(e.x-14,e.y-22,28*Math.max(0,e.hp)/100,4);
}

function draw(){
  ctx.fillStyle='#1b2430';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#223043';ctx.lineWidth=1;
  for(let x=0;x<=W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<=H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  for(const k of['A','B']){
    const s=SITES[k];
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);
    ctx.fillStyle=`rgba(${s.c},.14)`;ctx.fill();
    ctx.strokeStyle=`rgba(${s.c},.8)`;ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle=`rgba(${s.c},.9)`;ctx.font='bold 28px system-ui';ctx.textAlign='center';ctx.fillText(k,s.x,s.y+10);
  }
  ctx.fillStyle='#4a5a70';WALLS.forEach(([x,y,w,h])=>ctx.fillRect(x,y,w,h));
  ctx.strokeStyle='#8fa3bd';ctx.lineWidth=2;WALLS.forEach(([x,y,w,h])=>ctx.strokeRect(x,y,w,h));

  smokes.forEach(s=>{ctx.fillStyle=`rgba(200,205,215,${Math.min(.85,s.t/3)})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill()});
  flashes.forEach(s=>{ctx.fillStyle=`rgba(255,255,255,${s.t/.4})`;ctx.beginPath();ctx.arc(s.x,s.y,220,0,6.283);ctx.fill()});
  tracers.forEach(t=>{ctx.strokeStyle=`rgba(255,235,120,${t.t/.06})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(t.x1,t.y1);ctx.lineTo(t.x2,t.y2);ctx.stroke()});

  if(bomb){
    const blink=Math.floor(Date.now()/250)%2;
    ctx.fillStyle=blink?'#ff3b3b':'#7a1d1d';ctx.beginPath();ctx.arc(bomb.x,bomb.y,10,0,6.283);ctx.fill();
  }
  ents.forEach(drawEnt);

  // progress bars
  if(state==='live'&&!bomb&&plantProg>0){
    ctx.fillStyle='#fff';ctx.fillRect(player.x-25,player.y+18,50*plantProg/3,4);
    ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(player.x-25,player.y+18,50,4);
  }
  if(bomb&&defProg>0){
    ctx.fillStyle='#4fc3ff';ctx.fillRect(bomb.x-25,bomb.y-28,50*defProg/4,4);
  }

  // HUD
  ctx.fillStyle='#fff';ctx.font='bold 24px system-ui';ctx.textAlign='center';
  ctx.fillText(`YOU ${scores.me}  —  ${scores.en} ENEMY`,W/2,30);
  ctx.font='16px system-ui';
  ctx.fillText(`Round ${round}  ·  ${Math.max(0,Math.ceil(roundT))}s  ·  You: ${player.team==='ATK'?'Attack':'Defense'}`,W/2,54);
  if(bomb)ctx.fillText(`AETHER Core: ${Math.max(0,bombT).toFixed(1)}s`,W/2,76);
  if(msgT>0&&msg){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(W/2-300,H/2-120,600,40);ctx.fillStyle='#ffe85a';ctx.font='bold 18px system-ui';ctx.fillText(msg,W/2,H/2-94)}

  ctx.textAlign='left';ctx.font='16px system-ui';ctx.fillStyle='#dfe8f0';
  ctx.fillText(`HP ${Math.max(0,player.hp)}   Credits $${player.credits}`,20,H-70);
  ctx.fillText(`${WEAPONS[player.weapon].name}  ${player.rl>0?'reloading…':player.ammo+'/'+WEAPONS[player.weapon].mag}`,20,H-46);
  ctx.fillText(`Smoke ${player.sm}   Flash ${player.fl}`,20,H-22);

  if(state==='buy'){
    ctx.fillStyle='rgba(8,12,18,.88)';ctx.fillRect(W/2-320,H/2-150,640,300);
    ctx.strokeStyle='#4fc3ff';ctx.lineWidth=2;ctx.strokeRect(W/2-320,H/2-150,640,300);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 22px system-ui';
    ctx.fillText('BUY PHASE',W/2,H/2-115);
    ctx.font='16px system-ui';
    const lines=[
      `1 Pistol (free)   2 SMG $1200   3 Rifle $2700   4 Shotgun $1100`,
      `5 Smoke $200   6 Flash $200   (owned: ${player.owned.map(w=>WEAPONS[w].name).join(', ')})`,
      `X switch side (now: ${player.team==='ATK'?'Attack':'Defense'})`,
      ``,
      `Credits: $${player.credits}`,
      ``,
      `Attack: plant the AETHER Core on A or B (hold F in the site).`,
      `Defense: stop the plant or hold F near the Core to defuse it.`,
      `Q smoke · E flash · 1-4 switch weapons · mouse aim + hold to fire · WASD move`,
      ``,
      `ENTER to start the round`
    ];
    lines.forEach((t,i)=>ctx.fillText(t,W/2,H/2-80+i*24));
  }
  if(state==='over'){
    ctx.fillStyle='rgba(8,12,18,.9)';ctx.fillRect(W/2-260,H/2-70,520,140);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 26px system-ui';
    ctx.fillText(scores.me>scores.en?'MATCH WON':'MATCH LOST',W/2,H/2-25);
    ctx.font='18px system-ui';ctx.fillText(`${scores.me} – ${scores.en}   ·   ENTER to play again`,W/2,H/2+15);
  }
}

newMatch();
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
